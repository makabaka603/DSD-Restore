experiment:
  name: v1_minimal
  output_dir: experiments/v1_minimal
  seed: 42

model:
  # Formal V1 uses a compact NAFNet-style encoder/decoder sized for one RTX 5090.
  backbone_type: nafnet
  in_channels: 3
  out_channels: 3
  base_channels: 32
  token_dim: 64
  num_dense_tokens: 5
  num_sparse_tokens: 4
  prototype_temperature: 0.2

data:
  crop_size: 256
  # Frequent validation uses the same spatial scale as training. Final test.py
  # still evaluates uncropped full-resolution images.
  val_crop_size: 256
  # 1,000 optimizer steps per logical epoch. Sampling is with replacement,
  # so source probability is independent of the number of files it contains.
  samples_per_epoch: 16000
  train_sources:
    # V1 sampling follows the Word plan by degradation category:
    # single dense 30%, single sparse 20%, dense+dense 25%,
    # dense+sparse 20%, and three-degradation mixtures 5%.
    - name: snow100k
      input_dir: datasets/Snow100K/train/input
      gt_dir: datasets/Snow100K/train/gt
      task: snow
      probability: 0.10
    - name: rain13k
      input_dir: datasets/Rain13K/train/input
      gt_dir: datasets/Rain13K/train/target
      task: rain
      probability: 0.10
    - name: reside6k
      input_dir: datasets/RESIDE-6K/train/hazy
      gt_dir: datasets/RESIDE-6K/train/GT
      task: haze
      probability: 0.10
    - name: lolv2_real
      input_dir: datasets/LOLv2_real/Train/Input
      gt_dir: datasets/LOLv2_real/Train/GT
      task: lowlight
      probability: 0.05
    - name: lolv2_synthetic
      input_dir: datasets/LOLv2_synthetic/Train/Input
      gt_dir: datasets/LOLv2_synthetic/Train/GT
      task: lowlight
      probability: 0.05
    - name: div2k_dense_single
      clean_dir: datasets/DIV2K_train_HR
      mixtures:
        - [dust]
        - [sand]
        - [colorcast]
      probability: 0.10
    - name: div2k_dense_dense
      clean_dir: datasets/DIV2K_train_HR
      mixtures:
        - [dust, haze]
        - [dust, lowlight]
        - [sand, haze]
        - [haze, lowlight]
      probability: 0.25
    - name: div2k_dense_sparse
      clean_dir: datasets/DIV2K_train_HR
      mixtures:
        - [dust, rain]
        - [haze, rain]
        - [lowlight, rain]
        - [haze, snow]
        - [lowlight, snow]
      probability: 0.20
    - name: div2k_triple
      clean_dir: datasets/DIV2K_train_HR
      mixtures:
        - [dust, haze, lowlight]
        - [dust, lowlight, rain]
        - [haze, lowlight, rain]
        - [haze, lowlight, snow]
      probability: 0.05

  # Validation is capped per task and reported as a macro average, preventing
  # large datasets from dominating checkpoint selection.
  val_sources:
    - name: snow100k_val
      input_dir: datasets/Snow100K/val/input
      gt_dir: datasets/Snow100K/val/gt
      task: snow
      max_samples: 10
    - name: rain13k_val
      input_dir: datasets/Rain13K/test/Test100/input
      gt_dir: datasets/Rain13K/test/Test100/target
      task: rain
      max_samples: 10
    - name: reside6k_val
      input_dir: datasets/RESIDE-6K/test/hazy
      gt_dir: datasets/RESIDE-6K/test/GT
      task: haze
      max_samples: 10
    - name: lolv2_real_val
      input_dir: datasets/LOLv2_real/Test/Input
      gt_dir: datasets/LOLv2_real/Test/GT
      task: lowlight
      max_samples: 10
    - name: lolv2_synthetic_val
      input_dir: datasets/LOLv2_synthetic/Test/Input
      gt_dir: datasets/LOLv2_synthetic/Test/GT
      # The official test inputs have an extra leading "r" absent from GT names.
      gt_strip_input_prefix: r
      task: lowlight
      max_samples: 10
    - name: div2k_dust_val
      clean_dir: datasets/DIV2K_valid_HR
      synthetic: dust
      task: dust
      max_samples: 10
    - name: div2k_sand_val
      clean_dir: datasets/DIV2K_valid_HR
      synthetic: sand
      task: sand
      max_samples: 10
    - name: div2k_colorcast_val
      clean_dir: datasets/DIV2K_valid_HR
      synthetic: colorcast
      task: colorcast
      max_samples: 10
    - name: div2k_dense_dense_val
      clean_dir: datasets/DIV2K_valid_HR
      mixtures:
        - [dust, haze]
        - [dust, lowlight]
        - [sand, haze]
        - [haze, lowlight]
      max_samples: 10
    - name: div2k_dense_sparse_val
      clean_dir: datasets/DIV2K_valid_HR
      mixtures:
        - [dust, rain]
        - [haze, rain]
        - [lowlight, rain]
        - [haze, snow]
        - [lowlight, snow]
      max_samples: 10
    - name: div2k_triple_val
      clean_dir: datasets/DIV2K_valid_HR
      mixtures:
        - [dust, haze, lowlight]
        - [dust, lowlight, rain]
        - [haze, lowlight, rain]
        - [haze, lowlight, snow]
      max_samples: 10

  # RTX 5090 (32 GB) baseline. This is the physical and effective batch size;
  # gradient accumulation is intentionally 1. Reduce to 8 only after a real OOM.
  batch_size: 16
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  val_num_workers: 4
  val_prefetch_factor: 2

optimization:
  # Iteration-based training is independent of the number of training images.
  max_iters: 75000
  lr: 0.0002
  weight_decay: 0.0001
  min_lr: 0.000001
  warmup_iters: 3000

loss:
  lambda_rec: 1.0
  lambda_ssim: 0.2
  lambda_freq: 0.05
  lambda_color: 0.05
  lambda_cls: 0.05
  lambda_proto: 0.02
  lambda_sparse: 0.01

runtime:
  device: auto
  # LPIPS/DISTS pretrained backbones are cached on the data disk.
  torch_home: /root/autodl-tmp/torch-cache
  # Frequent weight snapshots must not fill the small system disk.
  checkpoint_dir: /root/autodl-tmp/DSD-Restor-checkpoints/v1_minimal
  amp: true
  amp_dtype: bfloat16
  cudnn_benchmark: true
  channels_last: true
  compile:
    enabled: true
    mode: max-autotune-no-cudagraphs
    dynamic: false
  # TensorBoard retains every iteration; values are synchronized in batches to
  # avoid forcing the GPU to wait for Python after every optimizer step.
  log_every_iters: 20
  # Per-iteration train metrics go to TensorBoard; validation selects weights.
  val_every_iters: 100
  probe_val_max_samples_per_source: 2
  selection_val_every_iters: 500
  selection_val_max_samples_per_source: 10
  # LPIPS/DISTS validation is deliberately sparser and uses small images.
  val_perceptual_every_iters: 1000
  val_perceptual_max_samples_per_source: 2
  val_perceptual_max_size: 256
  best_window_iters: 100
  selection_metric: psnr
  train_metrics:
    psnr_ssim_every_iters: 1
    perceptual_every_iters: 100
    perceptual_batch_samples: 4
  save_every_iters: 5000
  early_stop_patience_iters: 15000
  resume: null
  tensorboard:
    log_dir: /root/tf-logs
    log_storage_dir: /root/autodl-tmp/tf-logs
    symlink_log_dir: true
    run_name: v1_minimal
