experiment:
  name: v1_minimal
  output_dir: experiments/v1_minimal
  seed: 42

model:
  in_channels: 3
  out_channels: 3
  base_channels: 32
  token_dim: 64
  num_dense_tokens: 5
  num_sparse_tokens: 4

data:
  train_input_dir: data/mixed/train/input
  train_gt_dir: data/mixed/train/gt
  train_metadata: data/mixed/train/metadata.json
  val_input_dir: data/mixed/val/input
  val_gt_dir: data/mixed/val/gt
  val_metadata: data/mixed/val/metadata.json
  crop_size: 256
  # RTX 5090 (32 GB) baseline. Reduce to 8 if the real data pipeline runs OOM.
  batch_size: 16
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2

optimization:
  # Iteration-based training is independent of the number of training images.
  max_iters: 75000
  lr: 0.0002
  weight_decay: 0.0001
  min_lr: 0.000001
  warmup_iters: 3000

loss:
  lambda_rec: 1.0
  lambda_ssim: 0.2
  lambda_freq: 0.05
  lambda_color: 0.05
  lambda_cls: 0.05

runtime:
  device: auto
  amp: true
  amp_dtype: bfloat16
  cudnn_benchmark: true
  val_every_iters: 2000
  save_every_iters: 5000
  early_stop_patience_iters: 15000
  resume: null
