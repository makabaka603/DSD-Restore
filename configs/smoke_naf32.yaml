base_config: train_naf32_stage1.yaml

stage:
  name: smoke_naf32
  init_from_stage: null

experiment:
  name: smoke_naf32
  output_dir: experiments/smoke_naf32

optimization:
  max_iters: 20
  warmup_iters: 2

runtime:
  checkpoint_dir: /root/autodl-tmp/DSD-Restor-checkpoints/smoke_naf32
  init_checkpoint: null
  val_every_iters: 10
  selection_val_every_iters: 10
  best_window_iters: 10
  val_perceptual_every_iters: 10
  save_every_iters: 20
  compile:
    enabled: false
  diagnostics:
    scalar_every_iters: 10
    histogram_every_iters: 20
    image_every_iters: 20
    image_samples: 1
  tensorboard:
    run_name: smoke_naf32
