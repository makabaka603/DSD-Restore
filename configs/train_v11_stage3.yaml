base_config:
  - train_v1_stage3.yaml
  - v11_common.yaml

stage:
  name: v11_stage3
  objective: composite_degradation_finetuning
  init_from_stage: v11_stage2

experiment:
  name: v11_stage3_composite
  output_dir: experiments/v11_stage3_composite

loss:
  # Restoration should dominate late Stage 3 after routing has learned.
  auxiliary_decay_start: 0.25
  auxiliary_final_scale: 0.25

runtime:
  checkpoint_dir: /root/autodl-tmp/DSD-Restor-checkpoints/v11_stage3_composite
  init_checkpoint: /root/autodl-tmp/DSD-Restor-checkpoints/v11_stage2_joint/best.pth
  init_strict: true
  tensorboard:
    run_name: v11_stage3_composite
