base_config: screen_v11_control.yaml

stage:
  name: v11_screen_a2_dual_gate

experiment:
  name: v11_screen_a2_dual_gate
  output_dir: experiments/v11_screen_a2_dual_gate

model:
  fusion_mode: independent

runtime:
  checkpoint_dir: /root/autodl-tmp/DSD-Restor-checkpoints/v11_screen_a2_dual_gate
  # Only the new two-output gate is reinitialized; all shape-compatible V1
  # Stage 2 weights are loaded and the element-coverage check must exceed 95%.
  init_strict: false
  init_min_coverage: 0.95
  tensorboard:
    run_name: v11_screen_a2_dual_gate
