base_config: screen_v11_aux_off.yaml

stage:
  name: screen_d1_shared_capacity
  objective: shared_capacity_reallocation_screen
  init_from_stage: stage2

experiment:
  name: screen_d1_shared_capacity
  output_dir: experiments/screen_d1_shared_capacity

model:
  # D1 changes only capacity allocation: two blocks are removed from each
  # task-specific expert and four zero-residual NAFBlocks are added to the
  # shared bottleneck before tokenization and expert routing.
  dense_expert_blocks: 2
  sparse_expert_blocks: 2
  shared_bottleneck_blocks: 4

runtime:
  checkpoint_dir: /root/autodl-tmp/DSD-Restor-checkpoints/screen_d1_shared_capacity
  init_checkpoint: /root/autodl-tmp/DSD-Restor-checkpoints/v1_stage2_joint/best.pth
  init_strict: false
  # About 81% of the D1 state is inherited. The remainder is the new shared
  # path; removed expert blocks are intentionally ignored.
  init_min_coverage: 0.80
  init_allowed_missing_prefixes:
    - shared_bottleneck.
  tensorboard:
    run_name: screen_d1_shared_capacity
