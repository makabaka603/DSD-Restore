base_config: screen_v11_aux_off.yaml

stage:
  name: screen_d0_triple_balance
  objective: composite_sampling_balance_screen
  init_from_stage: stage2

experiment:
  name: screen_d0_triple_balance
  output_dir: experiments/screen_d0_triple_balance

data:
  # D0 changes only the conditional distribution inside Stage 3. The three
  # logical sources point to the same frozen paired dataset and are separated
  # by metadata, so no images need to be copied or regenerated.
  train_sources:
    - name: d0_dense_dense
      input_dir: datasets/SyntheticCompositeTrain/input
      gt_dir: datasets/SyntheticCompositeTrain/gt
      metadata_path: datasets/SyntheticCompositeTrain/metadata.json
      require_metadata: true
      include_groups: [dense_dense]
      min_degradations: 2
      max_degradations: 2
      probability: 0.40
    - name: d0_dense_sparse
      input_dir: datasets/SyntheticCompositeTrain/input
      gt_dir: datasets/SyntheticCompositeTrain/gt
      metadata_path: datasets/SyntheticCompositeTrain/metadata.json
      require_metadata: true
      include_groups: [dense_sparse]
      min_degradations: 2
      max_degradations: 2
      probability: 0.35
    - name: d0_triple
      input_dir: datasets/SyntheticCompositeTrain/input
      gt_dir: datasets/SyntheticCompositeTrain/gt
      metadata_path: datasets/SyntheticCompositeTrain/metadata.json
      require_metadata: true
      include_groups: [triple]
      min_degradations: 3
      max_degradations: 3
      probability: 0.25

runtime:
  checkpoint_dir: /root/autodl-tmp/DSD-Restor-checkpoints/screen_d0_triple_balance
  tensorboard:
    run_name: screen_d0_triple_balance
